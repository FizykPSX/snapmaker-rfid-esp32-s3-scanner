esphome:
  name: snapmaker-rfid-s3
  friendly_name: Snapmaker RFID Reader

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

  ap:
    ssid: "Snapmaker-RFID-S3 Fallback"
    password: !secret fallback_ap_password

captive_portal:

web_server:
  version: 3
  local: true

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

text:
  - platform: template
    name: "Printer Host"
    id: printer_host
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    min_length: 0
    max_length: 64

  - platform: template
    name: "Spoolman Host"
    id: spoolman_host
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    min_length: 0
    max_length: 64

spi:
  clk_pin: GPIO40
  mosi_pin: GPIO45

i2c:
  sda: GPIO8
  scl: GPIO9
  frequency: 100kHz

pn532_i2c:
  update_interval: 1s
  on_tag:
    then:
      - lambda: |-
          ESP_LOGI("rfid", "Tag UID: %s", x.c_str());
          if (tag.has_ndef_message()) {
            auto message = tag.get_ndef_message();
            auto records = message->get_records();
            for (auto &record : records) {
              ESP_LOGI("rfid", "NDEF payload: %s", record->get_payload().c_str());
            }
          } else {
            ESP_LOGI("rfid", "Tag has no NDEF message");
          }

binary_sensor:
  - platform: gpio
    id: button_up
    name: "Button Up"
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true

  - platform: gpio
    id: button_down
    name: "Button Down"
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true

  - platform: gpio
    id: button_ok
    name: "Button OK"
    pin:
      number: GPIO6
      mode: INPUT_PULLUP
      inverted: true

font:
  - file: "gfonts://Roboto"
    id: font_default
    size: 20

display:
  - platform: st7789v
    model: "Waveshare 1.47in 172X320"
    cs_pin: GPIO42
    dc_pin: GPIO41
    reset_pin: GPIO39
    backlight_pin: GPIO46
    lambda: |-
      it.print(10, 10, id(font_default), "Snapmaker RFID S3");
      it.print(10, 40, id(font_default), "Display bring-up OK");
